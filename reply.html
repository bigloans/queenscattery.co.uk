<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Reply to enquiry · Queens Cattery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2f4a34;
    --green-deep: #1f3324;
    --cream: #f7f3ea;
    --paper: #fffdf8;
    --ink: #1f2420;
    --muted: #5a645c;
    --line: #e3ddcf;
    --accent: #d9622b;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 400 17px/1.6 Inter, system-ui, sans-serif; }
  h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; line-height: 1.15; color: var(--green-deep); margin: 0 0 .5em; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.2rem; }
  p { margin: 0 0 1em; }
  a { color: var(--green); }

  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .choice { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid #d3ccbb; border-radius: 10px; background: var(--cream); cursor: pointer; font-weight: 500; }
  .choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--green); flex: none; }
  .choice:has(input:checked) { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); background: #eef2ea; }

  .field { display: block; margin-bottom: 18px; }
  .field > span { display: block; font-weight: 500; font-size: .95rem; margin-bottom: 6px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--green); flex: none; }
  input[type=text], input[type=email], input[type=password], textarea {
    width: 100%; font: inherit; color: var(--ink);
    padding: 11px 14px; background: var(--cream);
    border: 1px solid #d3ccbb; border-radius: 10px;
  }
  textarea { resize: vertical; min-height: 220px; }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
  .hint { color: var(--muted); font-size: .92rem; margin: 0 0 18px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; padding: 14px 24px; border-radius: 999px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #c4521f; }
  .btn-outline { background: none; border: 1px solid var(--green); color: var(--green); }
  .btn-outline:hover { background: rgba(47, 74, 52, .08); }

  @media (max-width: 480px) {
    .choices { grid-template-columns: 1fr; }
    .actions .btn { flex: 1 1 100%; text-align: center; }
  }
</style>
</head>
<body>

<main class="wrap">
  <h1>Reply to enquiry</h1>

  <section class="panel">
    <h2>Enquiry</h2>
    <dl id="summary"></dl>
  </section>

  <section class="panel">
    <h2>Your reply</h2>
    <div class="choices">
      <label class="choice"><input type="radio" name="answer" value="yes" checked><span>We can take them</span></label>
      <label class="choice"><input type="radio" name="answer" value="no"><span>We're full</span></label>
    </div>
    <label class="field">
      <span>Cats' names</span>
      <input type="text" id="names">
    </label>
    <label class="check" id="deposit-wrap">
      <input type="checkbox" id="deposit">
      <span id="deposit-label"></span>
    </label>
    <label class="field">
      <span>Message</span>
      <textarea id="message"></textarea>
    </label>
    <p class="hint">You can edit the message here, or in your email or messages app before you send it.</p>
    <div class="actions">
      <a class="btn btn-primary" id="send-email" hidden>Reply by email</a>
      <a class="btn btn-primary" id="send-text" hidden>Reply by text</a>
      <button type="button" class="btn btn-outline" id="copy">Copy message</button>
    </div>
  </section>

  <section class="panel" id="board" hidden>
    <h2>Kennel board</h2>
    <p id="board-status">Checking the board…</p>
    <form id="board-login" hidden>
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-outline" type="submit">Sign in to the board</button>
    </form>
    <button type="button" class="btn btn-primary" id="board-add" hidden>Add to board</button>
  </section>
</main>

<script>
  const DEPOSIT = 30;
  const SIGN_OFF = 'Thanks,\nRuss & Ange';

  const q = new URLSearchParams(location.search);
  const name = q.get('name') || '';
  const email = q.get('email') || '';
  const phone = q.get('phone') || '';
  const cats = +q.get('cats') || 1;
  const isNew = q.get('new') === '1';
  const stays = q.getAll('stay').map(s => s.split('_'));

  const $ = id => document.getElementById(id);
  const gbp = n => '£' + n.toLocaleString('en-GB');
  const shortDate = iso => new Date(iso + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const list = items => items.length < 2 ? items.join('') : `${items.slice(0, -1).join(', ')} and ${items.at(-1)}`;

  // First name only, so "Mrs Jane Smith" becomes "Jane" and "Mrs Smith" gives no name

  const TITLES = /^(mr|mrs|ms|miss|mx|dr|prof|sir|lady|lord|rev)\.?$/i;
  const nameParts = name.trim().split(/\s+/).filter(Boolean);
  const firstName = nameParts.length && TITLES.test(nameParts[0])
    ? (nameParts.length > 2 ? nameParts[1] : '')
    : (nameParts[0] || '');
  const dates = list(stays.map(([from, to]) => `${shortDate(from)} to ${shortDate(to)}`));
  const deposit = cats * DEPOSIT;

  // Drop ages from entries like "Tilly, 4 and Jasper, 9" or "Apollo 4 years old (born Dec 2021)"

  const guessNames = text => text
    .replace(/\([^)]*\)/g, ' ')
    .replace(/,?\s*\b(born|aged?)\b[^,]*?(\d{4}|\d+(\.\d+)?\s*(years?|yrs?|y\/?o|months?)?(\s*old)?)/gi, ' ')
    .replace(/,?\s*\d+(\.\d+)?\s*(years?|yrs?|y\/?o|months?)?(\s*old)?/gi, ' ')
    .replace(/\b(both|each)\b\s*$/i, ' ')
    .replace(/\s+/g, ' ')
    .replace(/ ,/g, ',')
    .trim();

  // Summary

  const rows = [
    ['Name', name],
    ['Email', email],
    ['Phone', phone],
    ['Cats', `${cats}${q.get('names') ? `, ${q.get('names')}` : ''}`],
    ['Dates', dates],
    ['Customer', isNew ? `New, deposit ${gbp(deposit)}` : 'Returning']
  ];
  rows.filter(([, v]) => v).forEach(([k, v]) => {
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = k;
    dd.textContent = v;
    $('summary').append(dt, dd);
  });

  // Message

  const answer = () => document.querySelector('[name=answer]:checked').value;

  $('names').value = guessNames(q.get('names') || '');
  $('deposit').checked = isNew;
  $('deposit-label').textContent = `Ask for a ${gbp(deposit)} deposit (${gbp(DEPOSIT)} per cat)`;

  const compose = () => {
    const who = $('names').value.trim() || (cats === 1 ? 'your cat' : `your ${cats} cats`);
    const hello = `Hello${firstName ? ' ' + firstName : ''}, thanks for your enquiry.`;
    if (answer() === 'no') {
      return `${hello} Sorry, we don't have availability for ${who} on ${dates}.\n\n${SIGN_OFF}`;
    }
    const booked = $('deposit').checked
      ? `I have provisionally booked you in. We require a non-refundable deposit of ${gbp(deposit)} (${gbp(DEPOSIT)} per cat) this time to confirm the booking. Please let me know how you'd like to pay it, or if you wish to cancel or amend the booking.`
      : 'I have booked you in, please let me know if you wish to cancel or amend the booking.';
    return `${hello} We have availability for ${who} on ${dates}. ${booked}\n\n${SIGN_OFF}`;
  };

  const renderLinks = () => {
    const body = encodeURIComponent($('message').value.replace(/\r?\n/g, '\r\n'));
    const subject = encodeURIComponent('Your booking enquiry with Queens Cattery');
    $('send-email').hidden = !email;
    $('send-email').href = `mailto:${email}?subject=${subject}&body=${body}`;
    $('send-text').hidden = !phone;
    $('send-text').href = `sms:${phone.replace(/[^\d+]/g, '')}?&body=${body}`;
  };

  const render = () => {
    $('deposit-wrap').hidden = answer() === 'no';
    $('message').value = compose();
    renderLinks();
  };

  document.querySelectorAll('[name=answer]').forEach(el => el.addEventListener('change', render));
  $('names').addEventListener('input', render);
  $('deposit').addEventListener('change', render);
  $('message').addEventListener('input', renderLinks);
  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('message').value);
      $('copy').textContent = 'Copied';
    } catch {
      $('message').select();
    }
  });

  render();
</script>

<script type="module">
  import { plan } from './app/planner.js';
  import * as store from './app/store.js';

  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const stays = q.getAll('stay').map(s => s.split('_'));
  const cats = +q.get('cats') || 1;
  const kennels = +q.get('kennels') || (cats === 3 ? 2 : Math.ceil(cats / 2));
  const name = q.get('name') || '';
  const phone = q.get('phone') || '';
  const shortDate = iso => new Date(iso + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const sourceOf = ([from, to]) => `${name}|${phone}|${from}_${to}`.toLowerCase();

  // Where a placement puts the cats, in words

  const where = p => {
    if (p.length === 2 && p.every(u => u.length === 1) && Math.abs(p[0][0].k - p[1][0].k) === 1 && Math.min(p[0][0].k, p[1][0].k) % 2) {
      return `kennels ${Math.min(p[0][0].k, p[1][0].k)} and ${Math.max(p[0][0].k, p[1][0].k)}, joined`;
    }
    const ks = p.map(u => u[0].k);
    const mid = p.some(u => u.length > 1) ? ', with a move mid-stay' : '';
    return `${ks.length > 1 ? 'kennels' : 'kennel'} ${ks.join(' and ')}${mid}`;
  };

  const rowsFor = () => stays.map(stay => store.blank({
    source: sourceOf(stay),
    name,
    email: q.get('email') || '',
    phone,
    cats,
    cat_names: $('names').value.trim(),
    kennels,
    joined: q.get('join') === '1',
    arrive: stay[0],
    depart: stay[1],
    diet: q.get('diet') || '',
    meds: q.get('meds') || '',
    new_customer: q.get('new') === '1'
  }));

  let all = [];

  async function check() {
    $('board-login').hidden = true;
    $('board-add').hidden = true;
    $('board-status').textContent = 'Checking the board…';
    try {
      all = await store.load();
    } catch (err) {
      $('board-status').textContent = `Couldn't load the board: ${err.message}`;
      return;
    }
    const rows = rowsFor();
    const done = rows.map(r => all.find(b => b.source === r.source));
    const fresh = rows.filter((r, i) => !done[i]);
    const res = plan([...all, ...fresh]);
    const freshIds = new Set(fresh.map(r => r.id));
    const moved = res.changed.filter(id => !freshIds.has(id)).length;

    const lines = rows.map((r, i) => {
      const dates = `${shortDate(r.arrive)} to ${shortDate(r.depart)}`;
      if (done[i]) return `${dates}: already on the board${done[i].placement ? `, in ${where(done[i].placement)}` : ', with no kennel yet'}.`;
      const p = res.placements[r.id];
      return p ? `${dates}: fits in ${where(p)}.` : `${dates}: no room as the board stands.`;
    });
    if (fresh.length && moved) lines.push(`${plural(moved, 'other booking')} would move to make room.`);
    $('board-status').innerHTML = lines.map(l => `<span style="display:block">${l.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`).join('');
    $('board-add').hidden = !fresh.length || document.querySelector('[name=answer]:checked').value !== 'yes';
  }

  $('board-add').addEventListener('click', async () => {
    const btn = $('board-add');
    btn.disabled = true;
    try {
      const rows = rowsFor().filter(r => !all.some(b => b.source === r.source));
      const { unplaced } = await store.addAndPlace(rows, all);
      await check();
      if (unplaced.length) $('board-status').append(' It’s saved and listed above the board, so you can make room for it there.');
    } catch (err) {
      $('board-status').textContent = `Couldn't add it: ${err.message}`;
    }
    btn.disabled = false;
  });

  $('board-login').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await store.signIn(e.target.email.value.trim(), e.target.password.value);
      check();
    } catch (err) {
      $('board-status').textContent = err.message || 'Couldn’t sign in.';
    }
  });

  // Only offer to add the booking when the reply says we can take them

  document.querySelectorAll('[name=answer]').forEach(el => el.addEventListener('change', () => {
    if ($('board-login').hidden) check();
  }));

  if (stays.length && !store.demo) {
    $('board').hidden = false;
    if (await store.signedIn()) check();
    else {
      $('board-status').textContent = 'Sign in to see whether this fits and add it to the board.';
      $('board-login').hidden = false;
    }
  }
</script>
</body>
</html>
